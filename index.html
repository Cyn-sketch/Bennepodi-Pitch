<meta property="og:title" content="Escyncial × Bennepodi">
<meta property="og:description" content="A pitch made for Bennepodi: turn 100K reel views into guests with paid marketing, AI commercials, WhatsApp, reviews and pre-order.">

<style>
/* Hallmark redesign · material: custom (Escyncial black, white, burgundy; brand accent per pitch) · genre: editorial with atmospheric dark · posture: Restrained, dark derived · signature: the brand's own ordering site, live in the hero · pre-emit critique: P4 H4 E4 S5 R4 V4 · weakest: P, MadAutomate dark kept by request */
:root{
  color-scheme:dark;
  --paper:oklch(16% 0.012 15); --paper-2:oklch(19.5% 0.013 15); --line:oklch(31% 0.014 15);
  --ink:oklch(95% 0.008 15); --muted:oklch(79% 0.012 15); --faint:oklch(69% 0.012 15);
  --studio:oklch(60% 0.17 15); --ok:oklch(80% 0.15 160); --bad:oklch(72% 0.16 25);
  --brand:oklch(60% 0.17 15); --brand-ink:oklch(98% 0.005 15);
  --bg:var(--paper); --bg2:var(--paper-2); --surface:var(--paper-2);
  --display:"Lato","Helvetica Neue",Arial,sans-serif;
  --body:"Manrope","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace; /* outlier: figures only */
  --s-3xs:2px; --s-2xs:4px; --s-xs:8px; --s-sm:12px; --s-md:16px; --s-lg:24px; --s-xl:40px; --s-2xl:64px; --s-3xl:96px; --s-4xl:144px;
  --fs-h1:clamp(2.5rem,1rem + 4.7vw,5.25rem); --fs-h2:clamp(2rem,1.2rem + 2.3vw,3.25rem); --fs-h3:clamp(1.25rem,1.1rem + .5vw,1.5625rem);
  --fs-lead:clamp(1.125rem,1rem + .4vw,1.3125rem); --fs-body:1rem; --fs-label:.875rem;
  --gutter:max(16px,min(64px,4.4vw));
  --r-sm:10px; --r-md:16px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
*,*::before,*::after{box-sizing:border-box}body{margin:0}
body{background:var(--paper);color:var(--ink);font:400 var(--fs-body)/1.6 var(--body);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;font-synthesis:none;font-kerning:normal}
.wrap{max-width:calc(1312px + 2 * var(--gutter));margin:0 auto;padding-left:max(var(--gutter),env(safe-area-inset-left,0px));padding-right:max(var(--gutter),env(safe-area-inset-right,0px))}
h1,h2,h3{margin:0;text-wrap:balance}
h1,h2{font-family:var(--display);font-weight:700;letter-spacing:-.01em}
h1{font-size:var(--fs-h1);line-height:1}
h2{font-size:var(--fs-h2);line-height:1.05}
h3{font-family:var(--display);font-size:var(--fs-h3);font-weight:700;line-height:1.25;letter-spacing:-.01em}
p{margin:0;max-width:65ch;text-wrap:pretty}
.k{font:400 var(--fs-label)/1.4 var(--body);color:var(--muted)}
.lede{font-size:var(--fs-lead);line-height:1.5;color:var(--muted);max-width:52ch}
.small{font-size:var(--fs-label);line-height:1.5;color:var(--muted)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:var(--s-md)}
.row{display:flex;gap:var(--s-sm);flex-wrap:wrap;align-items:center}
:focus-visible{outline:2px solid var(--brand);outline-offset:3px}

/* nav */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:300;background:var(--paper);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:301;background:var(--paper)}
.bar .wrap{display:flex;justify-content:space-between;align-items:center;gap:var(--s-lg);min-height:64px}
.logo{font:700 1rem var(--display);white-space:nowrap}
.nav{display:flex;gap:var(--s-lg)}
.nav a{font:400 var(--fs-label) var(--body);color:var(--muted);text-decoration:none}
.nav a:hover{color:var(--ink)}
.valid{font:400 var(--fs-label) var(--body);color:var(--muted);white-space:nowrap}

/* sections */
.band{padding-block:clamp(var(--s-2xl),9vw,var(--s-4xl));border-top:1px solid var(--line)}
.band.alt{background:var(--paper-2)}
.head{display:flex;flex-direction:column;gap:var(--s-sm);margin-bottom:var(--s-xl);max-width:52rem}


/* layered parallax: back layers drift slower than the page, the hero phone a touch faster */
.hero,.home-hero,.band{position:relative;overflow:clip}
.hero>.wrap,.home-hero>.wrap,.band>.wrap{position:relative;z-index:1}
.pl{position:absolute;inset:0;pointer-events:none;z-index:0}
.pl>*{position:absolute;will-change:transform}
.pl-word{font:700 clamp(6rem,19vw,19rem)/.8 var(--display);color:transparent;-webkit-text-stroke:1px var(--line);white-space:nowrap;bottom:-.12em;right:-2vw}
.pl.l .pl-word{right:auto;left:-2vw}
.pl-glow{width:min(56vw,720px);aspect-ratio:1;border-radius:50%;background:radial-gradient(closest-side,color-mix(in oklch,var(--brand) 16%,transparent),transparent);top:-10%;left:-12%}
.pl.l .pl-glow{left:auto;right:-12%}
@media (prefers-reduced-motion:reduce){.pl>*{transform:none!important}}

/* hero */
.hero{padding-block:var(--s-2xl) var(--s-3xl)}
.hero.solo{padding-block:var(--s-4xl) var(--s-4xl);min-height:min(78vh,760px);display:flex;align-items:center}.hero.solo>.wrap{width:100%}.hero.solo .hero-text{max-width:56rem}
.hero-grid{display:grid;grid-template-columns:6fr 5fr;gap:var(--s-2xl);align-items:center}
.hero-grid>*{min-width:0}
.hero-text{display:flex;flex-direction:column;gap:var(--s-lg);animation:settle .6s cubic-bezier(.2,.7,.2,1) backwards}
@keyframes settle{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hero-vis{display:flex;flex-direction:column;align-items:center;gap:var(--s-sm)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s-xs);min-height:48px;padding:0 var(--s-lg);background:var(--brand);color:var(--brand-ink);border:0;border-radius:var(--r-sm);font:700 1rem var(--body);cursor:pointer;text-decoration:none;transition:transform .12s ease-out}
.btn:hover{transform:translateY(-1px)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}

/* rush (split) */
.split{display:grid;grid-template-columns:5fr 7fr;gap:var(--s-2xl);align-items:center}
.split>*{min-width:0}
.sim{display:flex;flex-direction:column;gap:var(--s-md)}
.sim canvas{width:100%;height:clamp(260px,28vw,400px);display:block;border-radius:var(--r-md);background:var(--paper-2)}
.seg{display:inline-flex;border-radius:var(--r-sm);box-shadow:inset 0 0 0 1px var(--line);padding:var(--s-2xs);gap:var(--s-2xs)}
.seg button{border:0;background:transparent;color:var(--muted);font:700 var(--fs-label) var(--body);min-height:40px;padding:0 var(--s-md);border-radius:8px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);padding-top:var(--s-sm)}
.stat{padding:0 var(--s-md);border-left:1px solid var(--line)}
.stat:first-child{border-left:0;padding-left:0}
.stat b{display:block;font:700 1.5rem/1.2 var(--mono);font-variant-numeric:tabular-nums}
.stat.lost b{color:var(--bad)} .stat.won b{color:var(--ok)}

/* cost (form + figure) */
.calc-grid{display:grid;grid-template-columns:7fr 5fr;gap:var(--s-2xl);align-items:center}
.calc-grid>*{min-width:0}
.well{background:var(--paper);border-radius:var(--r-md);padding:var(--s-xl);display:flex;flex-direction:column;gap:var(--s-lg)}
.slider{display:flex;flex-direction:column;gap:var(--s-xs)}
.slider label{display:flex;justify-content:space-between;font-weight:700;gap:var(--s-sm)}
.slider label span{font-family:var(--mono);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--brand);min-height:24px}
.loss{display:flex;flex-direction:column;gap:var(--s-sm)}
.loss .big{font:700 clamp(2.5rem,1.5rem + 3vw,4rem)/1 var(--mono);color:var(--bad);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.loss .won{font:700 1.125rem var(--mono);color:var(--ok)}

/* look (switcher) */
.pv-grid{display:grid;grid-template-columns:5fr 7fr;gap:var(--s-2xl);align-items:center}
.pv-grid>*{min-width:0}
.pv-grid .phone{justify-self:center}
.tabs{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.tab{display:flex;flex-direction:column;gap:var(--s-2xs);text-align:left;background:transparent;color:var(--muted);border:0;border-bottom:1px solid var(--line);padding:var(--s-md) 0;cursor:pointer;font:inherit}
.tab b{font:700 1.125rem var(--body);color:var(--muted)}
.tab span.d{font-size:var(--fs-label)}
.tab:hover b{color:var(--ink)}
.tab[aria-selected="true"] b{color:var(--ink);text-decoration:underline;text-decoration-color:var(--brand);text-decoration-thickness:2px;text-underline-offset:6px}
.tab[aria-selected="true"]{color:var(--ink)}

.phone{width:clamp(280px,24vw,330px);max-width:100%;aspect-ratio:9/19;background:#05030A;border-radius:42px;padding:11px;border:1px solid var(--line);box-shadow:0 0 0 6px #141414;position:relative}
.phone::before{content:"";position:absolute;top:18px;left:50%;transform:translateX(-50%);width:84px;height:22px;background:#05030A;border-radius:12px;z-index:3}
.scr{background:#FFFBF5;color:#1D1410;border-radius:32px;height:100%;overflow:hidden;display:flex;flex-direction:column;position:relative;font-size:13px}
.scr .ah{background:var(--brand);color:var(--brand-ink);padding:46px 16px 14px}
.scr .ah small{display:block;font:700 .62rem var(--mono);letter-spacing:.1em;text-transform:uppercase;opacity:.75}
.scr .ah strong{font:700 1.2rem var(--display)}
.cats{display:flex;gap:6px;padding:10px 12px 4px;overflow:hidden}
.cats span{font-size:.7rem;font-weight:700;padding:5px 10px;border-radius:999px;background:#F1E8DC;white-space:nowrap}
.cats span:first-child{background:#1D1410;color:#FFFBF5}
.menu{flex:1;overflow:auto;padding:4px 12px}
.it{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid #EEE3D4}
.it .n{font-weight:700;line-height:1.2}
.it .p{font-size:.74rem;color:#7A6A5E;font-family:var(--mono)}
.food{width:44px;height:44px;border-radius:12px}
.food.stack{background:radial-gradient(circle at 50% 30%,#FFE7B0 0 18%,transparent 19%),repeating-linear-gradient(180deg,#E3A45A 0 6px,#C27B32 6px 8px);border-radius:50%}
.food.sandwich{background:linear-gradient(135deg,transparent 48%,#F1E2C4 49%),linear-gradient(180deg,#E9C88C 0 30%,#7BBF5A 30% 40%,#E0553F 40% 52%,#F4D38A 52% 62%,#E9C88C 62%);clip-path:polygon(0 100%,100% 100%,100% 0)}
.food.roll{background:radial-gradient(circle,#F7F3EA 0 30%,#E8735A 31% 40%,#F7F3EA 41% 55%,#1E2A22 56%);border-radius:50%}
.add{width:30px;height:30px;border-radius:9px;border:1.5px solid #1D1410;background:transparent;color:#1D1410;font:800 1rem var(--body);cursor:pointer}
.add.on{background:#1D1410;color:#FFFBF5}
.cart{margin:10px;background:#1D1410;color:#FFFBF5;border-radius:14px;padding:12px 14px;display:flex;justify-content:space-between;font-weight:700;font-size:.82rem}
.cart.go{background:var(--brand);color:var(--brand-ink)}
.mk{position:absolute;bottom:64px;right:12px;font:700 .55rem var(--mono);letter-spacing:.1em;text-transform:uppercase;color:#A1907F}

.tent{margin:auto 18px;background:var(--brand);color:var(--brand-ink);border-radius:18px;padding:22px 18px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;box-shadow:0 20px 30px -18px rgba(0,0,0,.4)}
.tent strong{font:700 1.25rem/1.1 var(--display)}
.tent canvas{width:130px;height:130px;background:#fff;border-radius:10px;padding:7px}
.tent .s{font-size:.78rem;font-weight:700}
.tent .t{font:700 .6rem var(--mono);letter-spacing:.12em;text-transform:uppercase;opacity:.7}
.wa{background:#EFE7DD;flex:1;display:flex;flex-direction:column;gap:7px;padding:12px;overflow:hidden}
.wa-h{background:#075E54;color:#fff;padding:46px 14px 12px;display:flex;gap:10px;align-items:center}
.wa-h i{width:30px;height:30px;border-radius:50%;background:var(--brand);display:block}
.wa-h b{display:block;font-size:.85rem} .wa-h small{font-size:.66rem;opacity:.8}
.bub{background:#fff;padding:7px 10px;border-radius:2px 10px 10px 10px;max-width:88%;font-size:.76rem;line-height:1.4;box-shadow:0 1px 1px rgba(0,0,0,.08)}
.bub small{display:block;text-align:right;color:#8A8A8A;font-size:.6rem}
.bub.me{align-self:flex-end;background:#DCF8C6;border-radius:10px 2px 10px 10px}
.day{align-self:center;background:#E1F2FB;color:#4A6572;font-size:.6rem;font-weight:700;padding:3px 8px;border-radius:6px;text-transform:uppercase;letter-spacing:.05em}
.rv{padding:56px 16px 16px;display:flex;flex-direction:column;gap:14px}
.faces{display:flex;gap:8px}
.faces span{flex:1;text-align:center;padding:10px 0;border-radius:12px;background:#F1E8DC;font-size:1.4rem}
.faces span.pick{background:var(--brand)}
.path{border-radius:12px;padding:10px 12px;font-size:.74rem;line-height:1.4}
.path.g{background:#E6F6EC} .path.p{background:#FBEAEA}
.path b{display:block;font-size:.78rem}
.gstars{color:#F4B400;letter-spacing:2px;font-size:1rem}
.ad{background:#000;color:#fff;flex:1;display:flex;flex-direction:column;justify-content:flex-end;position:relative;overflow:hidden}
.frames{position:absolute;inset:0}
.fr{position:absolute;inset:0;display:flex;align-items:flex-end;padding:24px 18px 70px;opacity:0;animation:fr 9s infinite}
.fr:nth-child(2){animation-delay:3s}.fr:nth-child(3){animation-delay:6s}
.fr span{font:700 1.3rem/1.1 var(--display);text-shadow:0 2px 20px rgba(0,0,0,.5)}
@keyframes fr{0%{opacity:0;transform:scale(1.08)}4%{opacity:1}30%{opacity:1}36%{opacity:0;transform:scale(1)}100%{opacity:0}}
.prog{position:absolute;left:14px;right:14px;top:46px;display:flex;gap:4px;z-index:2}
.prog i{flex:1;height:3px;background:rgba(255,255,255,.3);border-radius:2px;overflow:hidden;position:relative}
.prog i::after{content:"";position:absolute;inset:0;background:#fff;transform-origin:left;transform:scaleX(0);animation:pg 9s infinite linear}
.prog i:nth-child(2)::after{animation-name:pg2}.prog i:nth-child(3)::after{animation-name:pg3}
@keyframes pg{0%{transform:scaleX(0)}33.3%{transform:scaleX(1)}100%{transform:scaleX(1)}}
@keyframes pg2{0%,33.3%{transform:scaleX(0)}66.6%{transform:scaleX(1)}100%{transform:scaleX(1)}}
@keyframes pg3{0%,66.6%{transform:scaleX(0)}100%{transform:scaleX(1)}}
.adref{position:relative;z-index:2;margin:0 12px 12px;display:flex;gap:10px;align-items:center;background:#fff;color:#141414;border-radius:12px;padding:9px 12px;text-decoration:none;font-weight:700;font-size:.78rem;line-height:1.25}
.adref i{width:30px;height:30px;border-radius:50%;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-style:normal;font-size:.7rem;flex:none}
.adref small{display:block;font-weight:600;font-size:.62rem;letter-spacing:.08em;text-transform:uppercase;color:#6B6150}
.adtag{position:relative;z-index:2;margin:0 14px 10px;font:700 .6rem var(--mono);letter-spacing:.12em;text-transform:uppercase;opacity:.75}

/* Brand ordering site (lives inside the phone) */
.szw{position:absolute;inset:0;--y:#FFC629;--k:#141414;--cream:#FFF6DA;--szd:"Baloo 2",system-ui,sans-serif;--szb:"Poppins",system-ui,sans-serif;--mut:#6B6150;--g:#1F8A4C;font-family:var(--szb);font-size:12px;line-height:1.45;color:var(--k);background:#fff;overflow:hidden}
.szw *{box-sizing:border-box}
.szw button{font-family:inherit}
.szw .d{font-family:var(--szd);line-height:1;font-weight:800}
.sz{height:100%;overflow-y:auto;overflow-x:hidden;position:relative;scrollbar-width:none}
.sz-strip{background:var(--k);color:var(--y);font:600 9px/1 var(--szb);letter-spacing:.08em;text-transform:uppercase;text-align:center;padding:40px 8px 6px}
.sz-head{position:sticky;top:0;z-index:5;background:var(--k);color:#fff;display:flex;align-items:center;gap:8px;padding:8px 12px}
.sz-logo{width:26px;height:24px;background:var(--y);clip-path:polygon(50% 0,100% 100%,0 100%);display:grid;place-items:end center;font:800 13px/1 var(--szd);color:var(--k);padding-bottom:1px}
.sz-head b{font:800 15px/1 var(--szd);letter-spacing:.05em}
.sz-cartbtn{margin-left:auto;background:var(--y);color:var(--k);border:0;border-radius:999px;font-weight:700;font-size:11px;padding:6px 11px;cursor:pointer}
.sz-hero{background:var(--y);padding:18px 14px 16px;display:flex;flex-direction:column;gap:8px}
.sz-hero .d{font-size:31px;text-transform:var(--szcase,uppercase)}
.sz-hero .tag{font:700 15px var(--szd)}
.sz-hero p{margin:0;font-size:11px;max-width:none}
.sz-chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.sz-chip{flex:none;border:1.5px solid var(--k);background:transparent;color:var(--k);border-radius:999px;font-weight:600;font-size:10.5px;padding:5px 10px;cursor:pointer}
.sz-chip[aria-pressed="true"]{background:var(--k);color:var(--y)}
.sz-lbl{font-weight:700;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;opacity:.75}
.sz-go{background:var(--k);color:var(--y);border:0;border-radius:10px;padding:11px;font-weight:700;font-size:12px;cursor:pointer;margin-top:2px}
.sz-coins{margin:12px;background:var(--cream);border:1.5px dashed var(--dash);border-radius:12px;padding:10px 12px;display:flex;gap:10px;align-items:center;line-height:1.35}
.sz-coin{width:30px;height:30px;border-radius:50%;background:var(--y);border:2px solid var(--k);display:grid;place-items:center;font:800 12px var(--szd);flex:none}
.sz-tabs{position:sticky;top:40px;z-index:4;background:#fff;display:flex;gap:5px;overflow-x:auto;padding:8px 10px;border-bottom:1px solid #EEE;scrollbar-width:none}
.sz-tabs button{flex:none;border:0;color:var(--k);font-weight:600;font-size:11px;padding:6px 11px;border-radius:999px;background:#F3EFE4;cursor:pointer}
.sz-tabs button.on{background:var(--k);color:var(--y)}
.sz-sec{padding:16px 12px 4px}
.sz-sec h3{font:800 20px/1 var(--szd);margin:0 0 3px}
.sz-sub{color:var(--mut);font-size:10.5px}
.sz-it{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #F0ECE2}
.sz-ic{width:44px;height:44px;border-radius:12px;background:var(--cream);display:grid;place-items:center;font-size:22px}
.sz-n{font-weight:600;font-size:12px;line-height:1.25}
.sz-meta{display:flex;gap:6px;align-items:center;margin-top:3px;flex-wrap:wrap}
.sz-p{font-weight:700}
.sz-badge{font-weight:700;font-size:8.5px;letter-spacing:.06em;text-transform:uppercase;padding:2px 5px;border-radius:4px;background:var(--k);color:var(--y)}
.sz-badge.j{background:#E3F4E9;color:var(--g)}
.sz-veg{width:10px;height:10px;border:1.5px solid var(--g);display:inline-grid;place-items:center;flex:none}
.sz-veg::after{content:"";width:4px;height:4px;border-radius:50%;background:var(--g)}
.sz-add{border:1.5px solid var(--k);background:var(--y);color:var(--k);border-radius:8px;font-weight:700;font-size:11px;padding:6px 0;width:60px;cursor:pointer}
.sz-step{display:inline-flex;align-items:center;justify-content:space-between;width:60px;border:1.5px solid var(--k);border-radius:8px;background:var(--y)}
.sz-step button{border:0;background:transparent;width:20px;height:26px;font-weight:700;font-size:14px;cursor:pointer;color:var(--k)}

const $ = s => document.querySelector(s);
const rupee = n => "₹" + Math.round(n).toLocaleString("en-IN");
const app = $("#app");
let simStop = null;

function fmtDate(iso){ return new Date(iso+"T23:59:59").toLocaleDateString("en-IN",{day:"numeric",month:"short",year:"numeric"}); }
function daysLeft(iso){ return Math.ceil((new Date(iso+"T23:59:59") - new Date())/864e5); }

function route(){
  if (simStop) { simStop(); simStop = null; }
  const slug = location.hash.slice(1) || "bennepodi-r5t1";
  const p = PITCHES[slug];
  document.documentElement.style.removeProperty("--brand");
  document.documentElement.classList.remove("sz");
  document.documentElement.removeAttribute("style");
  if (!p) { renderHome(); return parallax(null); }
  if (daysLeft(p.validUntil) < 0) return renderExpired(p);
  renderPitch(p); parallax(p);
}

    <div class="sz-ptabs"><button data-pm="upi" aria-pressed="${m==="upi"}">UPI</button><button data-pm="card" aria-pressed="${m==="card"}">Card</button></div>
    ${m==="upi"?`
      <span class="sz-h" style="margin:0">Pay with your UPI app</span>
      <div class="sz-apps">${[["GPay","#4285F4","G"],["PhonePe","#5F259F","Pe"],["Paytm","#00BAF2","P"]].map(([n,c,l])=>`<button class="sz-app" data-payapp="${n}"><i style="background:${c}">${l}</i>${n}</button>`).join("")}</div>
      <div class="sz-qr"><canvas id="szqr" width="84" height="84" aria-label="Sample UPI QR"></canvas><div><b>Or scan to pay</b><br><span class="sz-sub">Use any UPI app on another phone.</span><br><button class="sz-dip" style="margin-top:6px" data-payapp="UPI QR">I've paid</button></div></div>`
    :`
      <span class="sz-h" style="margin:0">Saved card</span>
      <div class="sz-card"><small>Demo card</small><span>•••• •••• •••• 4242</span><div style="display:flex;justify-content:space-between"><small>Valid thru 08/29</small><small>Visa</small></div></div>
      <button class="sz-cta alt" data-payapp="Card">Pay ${rupee(tot)} securely</button>`}
    <span class="sz-demo">🔒 Demo payment screen. No money moves and no details are collected.</span>
  </div>`;
  if(m==="upi") drawQR($("#szqr"));
}
function szPaying(app){
  const sh=$("#szsheet"), tot=szSub()-szCoins();

  sh.innerHTML=`<div class="sz-sh"><span class="d">Payment</span><span></span></div>
  <div class="sz-wait" id="szwait"><span class="sz-spin"></span><b>${app==="Card"?"Confirming with your bank…":app==="UPI QR"?"Checking your payment…":"Approve the request in "+app}</b><span class="sz-sub">${rupee(tot)} to ${SZ.brand}</span></div>`;
  SZS.timers.forEach(clearTimeout);
  SZS.timers=[setTimeout(()=>{const w=$("#szwait"); if(!w) return; w.innerHTML=`<span class="sz-paid">✓</span><b class="d" style="font-size:22px">Payment successful</b><span>${rupee(tot)} paid via ${app}</span><span class="sz-sub">Ref no. ${Math.floor(1e11+Math.random()*9e11)}</span>`;},1700),

}
function szOpen(view){ SZS.view=view; const sh=$("#szsheet"); view==="cart"?szCart():view==="pay"?szPay():szDone(); sh.classList.add("open"); sh.setAttribute("aria-hidden","false"); szRefresh(); }
function szClose(){ const sh=$("#szsheet"); sh.classList.remove("open"); sh.setAttribute("aria-hidden","true"); SZS.view="cart"; szRefresh(); }
function bindSz(){
  const w=$("#szw"), sz=$("#sz");
  w.addEventListener("click",e=>{
    const t=e.target.closest("button"); if(!t) return;
    if(t.dataset.inc){ const k=t.dataset.inc, l=SZS.lines.find(x=>x.k===k); l?l.qty++:SZS.lines.push({k,qty:1,meal:false}); szRefresh(); return; }
    if(t.dataset.dec){ const k=t.dataset.dec, i=SZS.lines.findIndex(x=>x.k===k); if(i>-1){SZS.lines[i].qty--; if(!SZS.lines[i].qty) SZS.lines.splice(i,1);} szRefresh(); return; }
    if(t.dataset.cat){ const el=$("#sz-"+t.dataset.cat); sz.scrollTo({top:el.offsetTop-78,behavior:"smooth"}); w.querySelectorAll("#sztabs button").forEach(b=>b.classList.toggle("on",b===t)); return; }
    const g=t.parentElement.dataset.grp;
    if(g){ SZS[g]= g==="outlet"? +t.dataset.v : t.dataset.v; t.parentElement.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",b===t)); return; }
    const a=t.dataset.sz;
    if(a==="menu") sz.scrollTo({top:$("#sztabs").offsetTop-40,behavior:"smooth"});
    if(a==="cart") szOpen("cart");
    if(a==="close") szClose();
    if(a==="place") szOpen(SZS.pay==="cash"?"done":"pay");
    if(a==="back") szOpen("cart");
    if(t.dataset.pm){ SZS.pay=t.dataset.pm; szPay(); return; }
    if(t.dataset.payapp){ szPaying(t.dataset.payapp); return; }
    if(a==="again"){ SZS.lines=[]; SZS.paidWith=null; SZS.timers.forEach(clearTimeout); szClose(); sz.scrollTo({top:0}); }
    if(a==="rate") $("#szrate").textContent="On the real site this opens "+SZ.brand+"'s Google review page.";
  });
  w.addEventListener("change",e=>{
    const t=e.target;
    if(t.dataset.meal!==undefined){ SZS.lines[+t.dataset.meal].meal=t.checked; szCart(); szRefresh(); }
    else if(t.id==="szcoins"){ SZS.coins=t.checked; szCart(); }
    else if(t.name==="sz-mode"||t.name==="sz-pay"){ SZS[t.name.slice(3)]=t.value; szCart(); }
  });
  szRefresh();
}

function bindOrder(p){
  const q=p.menu.map(()=>0);
  $("#menu").addEventListener("click",e=>{const b=e.target.closest(".add");if(!b)return;const i=+b.dataset.i;q[i]=q[i]?0:1;b.classList.toggle("on",!!q[i]);b.textContent=q[i]?"✓":"+";
    const n=q.reduce((a,b)=>a+b,0),t=q.reduce((a,x,j)=>a+x*p.menu[j][1],0),c=$("#cart");
    c.classList.toggle("go",n>0);
    c.innerHTML=n?`<span>${n} item${n>1?"s":""} · Place order</span><span class="num">${rupee(t)}</span>`:`<span>Tap + to add</span><span class="num">${rupee(0)}</span>`;});
}
function drawQR(c){
  const x=c.getContext("2d"),n=25,s=c.width/n;let seed=7;const r=()=>(seed=(seed*9301+49297)%233280)/233280;
  x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.fillStyle="#111";
  const f=(a,b)=>a<8&&b<8;
  for(let i=0;i<n;i++)for(let j=0;j<n;j++){if(f(i,j)||f(n-1-i,j)||f(i,n-1-j))continue;if(r()>.52)x.fillRect(i*s,j*s,s+.3,s+.3)}
  [[0,0],[n-7,0],[0,n-7]].forEach(([a,b])=>{x.fillStyle="#111";x.fillRect(a*s,b*s,7*s,7*s);x.fillStyle="#fff";x.fillRect((a+1)*s,(b+1)*s,5*s,5*s);x.fillStyle="#111";x.fillRect((a+2)*s,(b+2)*s,3*s,3*s)});
}


/* ---------------- the core: rotating particle sphere ---------------- */
function startCore(cv,p){
  const ctx=cv.getContext("2d"), studio=getComputedStyle(document.documentElement).getPropertyValue("--studio").trim();
  let W,H,raf=0,a=0,last=0;
  const size=()=>{const d=Math.min(2,devicePixelRatio||1);W=cv.clientWidth;H=cv.clientHeight;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);};
  size(); const ro=new ResizeObserver(size); ro.observe(cv);
  const N=760, pts=[];
  for(let i=0;i<N;i++){const y=1-2*(i+.5)/N,r=Math.sqrt(1-y*y),t=i*2.39996;pts.push([Math.cos(t)*r,y,Math.sin(t)*r]);}
  function draw(){
    ctx.clearRect(0,0,W,H);
    const wide=W>760, cx=wide?W*.74:W*.62, cy=wide?H*.48:H*.3, R=Math.min(W,H)*(wide?.38:.34);
    
    const ca=Math.cos(a),sa=Math.sin(a),ct=Math.cos(.42),st=Math.sin(.42);
    for(const [x,y,z] of pts){
      const x1=x*ca+z*sa, z1=-x*sa+z*ca, y1=y*ct-z1*st, z2=y*st+z1*ct;
      const k=1/(1.9-z2*.6), sx=cx+x1*R*k, sy=cy+y1*R*k, front=z2>0;
      ctx.globalAlpha=front?.35+.55*z2:.12; ctx.fillStyle=front?p.accent:studio;
      ctx.fillRect(sx,sy,front?1.8:1.2,front?1.8:1.2);
    }
    ctx.globalAlpha=.5;ctx.strokeStyle=studio;ctx.lineWidth=1;
    for(const [rx,ry,off] of [[1.45,.32,0],[1.25,.5,1.3]]){ctx.beginPath();ctx.ellipse(cx,cy,R*rx,R*ry,a*.5+off,0,7);ctx.stroke();}
    ctx.globalAlpha=1;
  }
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  function loop(t){const dt=Math.min(.05,(t-(last||t))/1000);last=t;a+=dt*.22;draw();raf=requestAnimationFrame(loop);}
  if(reduce) draw(); else raf=requestAnimationFrame(loop);
  return ()=>{cancelAnimationFrame(raf);ro.disconnect();};
}

/* ---------------- rush-hour simulation ---------------- */
function startSim(cv,p){
  const ctx=cv.getContext("2d"), css=getComputedStyle(document.documentElement);
  const C={brand:p.accent, ok:css.getPropertyValue("--ok").trim(), bad:css.getPropertyValue("--bad").trim(), studio:css.getPropertyValue("--studio").trim(), line:css.getPropertyValue("--line").trim(), muted:css.getPropertyValue("--faint").trim()};
  let W=0,H=0,dpr=1;
  const size=()=>{dpr=Math.min(2,window.devicePixelRatio||1);W=cv.clientWidth;H=cv.clientHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);};
  size(); const ro=new ResizeObserver(size); ro.observe(cv);

  let qr=false, people=[], queue=[], seats=[], won=0, lost=0, spawnT=0, svcT=0, raf=0, last=0;
  const avg=p.calc.order;
  const mkSeats=()=>{seats=[];for(const band of [.2,.8])for(let i=0;i<5;i++)for(let r=0;r<2;r++)seats.push({x:.3+i*.1,y:band+(r?.07:-.07)*(band<.5?1:-1),used:null});};
  mkSeats();
  const reset=()=>{people=[];queue=[];mkSeats();won=0;lost=0;spawnT=0;svcT=0;upd();};
  const upd=()=>{$("#s-won").textContent=won;$("#s-lost").textContent=lost;$("#s-rs").textContent=rupee(lost*avg);};
  const qpos=i=>({x:.84-i*.055,y:.5});
  const go=(pp,x,y,then)=>{pp.tx=x;pp.ty=y;pp.then=then;};
  function joinQueue(pp){
    if(queue.length>=7){pp.c=C.bad;go(pp,.5+Math.random()*.2,.5,()=>{pp.wait=.5;pp.after=()=>{lost++;upd();go(pp,.45+Math.random()*.3,1.15,()=>pp.dead=true)}});return;}
    queue.push(pp);pp.inQ=true;
  }
  function arrive(pp){
    if(qr && Math.random()<.78){
      const seat=seats.find(s=>!s.used);
      if(seat){seat.used=pp;pp.scan=.6;pp.wait=.6;pp.after=()=>{pp.c=C.studio;go(pp,seat.x,seat.y,()=>{won++;upd();pp.c=C.ok;pp.wait=6+Math.random()*3;pp.after=()=>{seat.used=null;go(pp,seat.x,seat.y<.5?-.15:1.15,()=>pp.dead=true)}})};return;}
    }
    joinQueue(pp);
  }
  function spawn(){const pp={x:-.03,y:.5+(Math.random()-.5)*.12,c:(document.documentElement.classList.contains("sz")?"#141414":"#E9E3F5"),wait:0};go(pp,.08,.5+(Math.random()-.5)*.08,()=>arrive(pp));people.push(pp);}
  function step(dt){
    spawnT-=dt; if(spawnT<=0){spawn();spawnT=.5+Math.random()*.25;}
    queue.forEach((pp,i)=>{const q=qpos(i);pp.tx=q.x;pp.ty=q.y;});
    if(queue.length){const f=queue[0];if(Math.hypot((f.x-qpos(0).x)*W,(f.y-.5)*H)<3){svcT+=dt;if(svcT>1.7){svcT=0;queue.shift();f.inQ=false;won++;upd();f.c=C.ok;go(f,.95,-.15,()=>f.dead=true);}}}
    const sp=110;
    for(const pp of people){
      if(pp.wait>0){pp.wait-=dt;if(pp.scan)pp.scan-=dt;if(pp.wait<=0&&pp.after){const a=pp.after;pp.after=null;a();}continue;}
      const dx=(pp.tx-pp.x)*W, dy=(pp.ty-pp.y)*H, d=Math.hypot(dx,dy);
      if(d<2){pp.x=pp.tx;pp.y=pp.ty;if(pp.then&&!pp.inQ){const t=pp.then;pp.then=null;t();}continue;}
      const m=Math.min(d,sp*dt);pp.x+=dx/d*m/W;pp.y+=dy/d*m/H;
    }
    people=people.filter(pp=>!pp.dead);
  }
  function draw(){
    ctx.clearRect(0,0,W,H);
    ctx.font="700 10px 'JetBrains Mono', monospace";ctx.fillStyle=C.muted;ctx.textBaseline="top";
    // counter
    ctx.fillStyle=C.brand;ctx.globalAlpha=.9;ctx.fillRect(.88*W,.36*H,8,.28*H);ctx.globalAlpha=1;
    ctx.fillStyle=C.muted;ctx.fillText("COUNTER",Math.min(.86*W,W-64),.68*H);
    ctx.fillText("DOOR",8,.6*H);
    // tables
    ctx.strokeStyle=C.line;ctx.lineWidth=1;
    for(const band of [.2,.8]){ctx.strokeRect(.26*W,(band-.13)*H,.48*W,.26*H);}
    ctx.fillStyle=C.muted;ctx.fillText(qr?"TABLES · ORDERING BY QR":"TABLES",.26*W+6,(.07)*H+2);
    // queue lane
    ctx.setLineDash([3,5]);ctx.beginPath();ctx.moveTo(.45*W,.5*H);ctx.lineTo(.86*W,.5*H);ctx.stroke();ctx.setLineDash([]);
    // people
    for(const pp of people){
      const x=pp.x*W,y=pp.y*H;
      if(pp.scan>0){ctx.strokeStyle=C.studio;ctx.globalAlpha=pp.scan/.6;ctx.beginPath();ctx.arc(x,y,6+(.6-pp.scan)*30,0,7);ctx.stroke();ctx.globalAlpha=1;}
      ctx.fillStyle=pp.c;ctx.beginPath();ctx.arc(x,y,4.5,0,7);ctx.fill();
    }
  }
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  function loop(t){const dt=Math.min(.05,(t-(last||t))/1000);last=t;if(!paused)step(dt);draw();raf=requestAnimationFrame(loop);}
  const setMode=m=>{qr=m;$("#m-now").setAttribute("aria-pressed",!m);$("#m-qr").setAttribute("aria-pressed",m);reset();if(reduce){for(let i=0;i<600;i++)step(1/30);draw();}};
  $("#m-now").addEventListener("click",()=>setMode(false));
  $("#m-qr").addEventListener("click",()=>setMode(true));
  let paused=false; $("#m-pause").addEventListener("click",e=>{paused=!paused;e.currentTarget.textContent=paused?"Play":"Pause";e.currentTarget.setAttribute("aria-pressed",paused);});
  if(reduce){setMode(false);}else{for(let i=0;i<240;i++)step(1/30);raf=requestAnimationFrame(loop);}
  return ()=>{cancelAnimationFrame(raf);ro.disconnect();};
}


/* ---------------- layered parallax ---------------- */
let plOff=null;
function parallax(p){
  if(plOff){plOff();plOff=null;}
  const words={rush:"Rush",cost:"Cost",look:"Scan",ideas:"Ideas",services:"System",contact:"Sign"};
  [...app.querySelectorAll(".hero,.home-hero,.band")].forEach((sec,i)=>{
    const w=sec.classList.contains("hero")||sec.classList.contains("home-hero")?(p?p.brand:STUDIO.name):(words[sec.id]||"");
    const pl=document.createElement("div");pl.className="pl"+(i%2?" l":"");pl.setAttribute("aria-hidden","true");
    pl.innerHTML=`<span class="pl-glow" data-depth=".6"></span>${w?`<span class="pl-word" data-depth=".38">${w}</span>`:""}`;
    sec.prepend(pl);
  });
  const fg=[[".hero .hero-text",.14],[".home-hero .hero-text",.14],["#rush .sim",-.06],["#look .phone",-.08],["#cost .loss",-.06],[".head",.05]];
  fg.forEach(([q,d])=>app.querySelectorAll(q).forEach(el=>el.dataset.depth=d));
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const els=[...app.querySelectorAll("[data-depth]")].map(el=>({el,d:+el.dataset.depth,sec:el.closest(".hero,.home-hero,.band"),hero:!!el.closest(".hero,.home-hero")&&el.classList.contains("hero-text")}));
  let raf=0;
  const tick=()=>{raf=0;const vh=innerHeight,k=innerWidth<960?.5:1;
    for(const o of els){const r=o.sec.getBoundingClientRect();if(r.bottom<-200||r.top>vh+200)continue;
      const off=(r.top+r.height/2-vh/2);let y=off*o.d*k;
      if(o.hero){y=Math.max(0,-r.top)*o.d*k;o.el.style.opacity=Math.max(.15,1-Math.max(0,-r.top)/(r.height*.9));}
      o.el.style.transform=`translate3d(0,${y.toFixed(1)}px,0)`;}};
  const req=()=>{if(!raf)raf=requestAnimationFrame(tick);};
  addEventListener("scroll",req,{passive:true});addEventListener("resize",req);tick();
  plOff=()=>{removeEventListener("scroll",req);removeEventListener("resize",req);cancelAnimationFrame(raf);};
}
